
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidéo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <video id="video" controls playsinline>
        <source src="video.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo.
    </video>

    <script>
        const video = document.getElementById("video");

        // Volume maximal
        video.volume = 1;

        // Lancement après interaction avec la page
        document.addEventListener("click", function() {
            video.volume = 1;
            video.play();
        }, { once: true });
    </script>

</body>
</html>
